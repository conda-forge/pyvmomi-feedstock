schema_version: 1

context:
  version: 9.1.0.0

package:
  name: pyvmomi
  version: ${{ version }}

source:
  url: https://github.com/vmware/pyvmomi/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 93a83b9d0bcb2004e9ff81f4549070462c66d9705b0a6c08795c105168e00ba5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools
  run:
    - python >=${{ python_min }}
    - six >=1.7.3

tests:
  - python:
      imports:
        - pyVim
        - pyVmomi
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - '*'

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: VMware vSphere Python SDK
  homepage: https://github.com/vmware/pyvmomi

extra:
  recipe-maintainers:
    - pg-hbk
    - sy-hbk
    - maresb
